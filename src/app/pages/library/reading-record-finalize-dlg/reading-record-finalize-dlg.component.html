<div>
  <form nz-form [formGroup]="detailFormGroup">
    <!-- Book (display context only) -->
    <div nz-row class="line-item">
      <label nz-col nzSpan="7" style="text-align: right">{{ 'Library.Book' | transloco }}</label>
      <div nz-col nzSpan="12" class="line-content">
        <a nz-typography>{{ bookName }}</a>
      </div>
    </div>

    <!-- End date: mandatory for Complete, optional for Abort -->
    <nz-form-item>
      <nz-form-label [nzSpan]="7" [nzRequired]="!isAbort()">{{ 'Common.EndDate' | transloco }}</nz-form-label>
      <nz-form-control [nzSpan]="12" nzHasFeedback [nzErrorTip]="dateTpl">
        <nz-date-picker formControlName="dateControl" [nzDisabledDate]="disabledDate"></nz-date-picker>
        <ng-template #dateTpl>
          <ng-container>{{ 'Common.FieldIsMandatory' | transloco }}</ng-container>
        </ng-template>
      </nz-form-control>
    </nz-form-item>

    @if (isAbort()) {
      <div nz-row class="line-item">
        <div nz-col [nzSpan]="12" [nzOffset]="7">
          <span nz-typography nzType="secondary">{{ 'Library.AbortReadingHint' | transloco }}</span>
        </div>
      </div>
    }
  </form>
</div>
<div *nzModalFooter>
  <button nz-button nzType="default" (click)="handleCancel()">{{ 'Common.Cancel' | transloco }}</button>
  <button nz-button nzType="primary" (click)="handleOk()" [disabled]="!isSubmittedAllowed()">
    {{ (isAbort() ? 'Library.AbortReading' : 'Library.CompleteReading') | transloco }}
  </button>
</div>
